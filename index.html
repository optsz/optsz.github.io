<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МКП «Покровводоканал» — Матеріали</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f9;
      color: #222222;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 10px;
      padding: 28px 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .logo {
      width: 84px;
      height: 84px;
      object-fit: contain;
      margin: 0 auto 14px;
      display: block;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #0d3b66;
    }
    p {
      margin: 0 0 22px;
      font-size: 14px;
      color: #555555;
    }
    .btn {
      display: block;
      text-decoration: none;
      padding: 13px 16px;
      margin-bottom: 12px;
      border-radius: 7px;
      font-size: 15px;
      font-weight: bold;
    }
    .btn-test {
      background-color: #8b1e1e;
      color: #ffffff;
    }
    .btn-logo {
      background-color: #1b6ca8;
      color: #ffffff;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://optsz.github.io/vodokanal-logo/logo.png" alt="Логотип МКП Покровводоканал">
    <h1>МКП «Покровводоканал»</h1>
    <p>Швидкий перехід до доступних матеріалів</p>
    <a class="btn btn-test" href="https://optsz.github.io/vodokanal-tests/test-op.html">
      Тест з охорони праці
    </a>
    <a class="btn btn-logo" href="https://optsz.github.io/vodokanal-logo/logo.png" target="_blank">
      Відкрити логотип (PNG)
    </a>
  </div>
</body>
</html>
